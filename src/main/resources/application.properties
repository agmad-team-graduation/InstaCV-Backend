# =============================================================================
# INSTACV APPLICATION CONFIGURATION
# =============================================================================

# Application Basic Configuration
spring.application.name=InstaCv
server.port=8080

# Active Profile Configuration
# Available profiles:
# - dev: Local development with local AI services
# - dev-remote-ai: Local development with remote AI services
# - dev-remote-ai-db: Local development with remote AI and remote database
# - prod: Production environment
spring.profiles.active=prod

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
# JWT Configuration
jwt.secret=${JWT_SECRET:default-secret-change-in-production}
jwt.expiration.milliseconds=86400000
jwt.expiration.seconds=86400

# =============================================================================
# EXTERNAL SERVICES CONFIGURATION
# =============================================================================
# Job Scraping Configuration
external.jobs.api.remoteok=https://remoteok.com/api

# AI Services Configuration
gemini.api.key=${GEMINI_API_KEY}
groq.api.key=${GROQ_API_KEY}

# =============================================================================
# FILE UPLOAD CONFIGURATION
# =============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# CLOUDINARY CONFIGURATION
# =============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dfewlbqaa}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}