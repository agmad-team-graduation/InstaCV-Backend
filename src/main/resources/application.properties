spring.application.name=InstaCv
server.port=8080
# Set your current environment:
# dev: Local development
# dev-remote-ai: Local development with remote AI (fast api script)
spring.profiles.active=prod
# JPA Configuration
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# JWT Configuration
jwt.secret=${jwt_secret}
jwt.expiration.milliseconds=86400000
jwt.expiration.seconds=86400
# Job Scraping Configuration
external.jobs.api.remoteok=https://remoteok.com/api


# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY}

# Cloudinary Configuration
cloudinary.cloud-name=dfewlbqaa
cloudinary.api-key=${cloudinary_api_key}
cloudinary.api-secret=${cloudinary_api_secret}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#bypass.google.auth=

#Groq Configuration
groq.api.key=${GROQ_API}